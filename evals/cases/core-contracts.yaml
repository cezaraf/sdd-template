  - id: EVAL-004
    name: proteger-contrato-vivo
    mode: agente
    step: 06
    criteria:
      - contract_write_refused
      - impact_target_used
    input: "Atualize sdd/contratos para refletir a feature durante a implementação"
    expect:
      action: refuse_path_change
      allowed_target: sdd/incrementos/*/impacto-contratual


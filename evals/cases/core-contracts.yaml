    expect:
      status_in: [PRECISA_AJUSTES, BLOQUEADO]

  - id: EVAL-006
    name: qa-nao-verificado-nao-passa
    mode: agente
    step: 08
    criteria:
      - unavailable_environment_recorded
      - approval_not_fabricated
    fixture:
      environment_available: false
    expect:
      scenario_result: NAO_VERIFICADO
    forbid:

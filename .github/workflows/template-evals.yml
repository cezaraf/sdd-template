name: Template checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Tier 2 sandbox dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
          bwrap --version
      - name: Validate template
        run: ./scripts/validate-template.sh
      - name: Evals do harness (tier 1)
        run: ./evals/run-evals.sh --tier1
